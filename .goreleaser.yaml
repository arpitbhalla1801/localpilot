before:
  hooks:
    - go mod tidy
    - go run ./tools/gen-man
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/localpilot
archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
    - goos: windows
      format: zip
    files:
      - LICENSE*
      - README*
      - man/*
nfpms:
  - id: localpilot
    package_name: localpilot
    file_name_template: >-
      {{ .PackageName }}_{{ .Arch }}
    vendor: LocalPilot
    homepage: https://github.com/arpitbhalla1801/localpilot
    maintainer: Arpit Bhalla <arpitbhalla725@gmail.com>
    description: >-
      Your command center for everything running on localhost — discover,
      inspect, and safely kill processes by port or PID.
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: ./man/localpilot.1
        dst: /usr/share/man/man1/localpilot.1
      - src: ./man/localpilot-list.1
        dst: /usr/share/man/man1/localpilot-list.1
      - src: ./man/localpilot-port.1
        dst: /usr/share/man/man1/localpilot-port.1
      - src: ./man/localpilot-inspect.1
        dst: /usr/share/man/man1/localpilot-inspect.1
      - src: ./man/localpilot-kill.1
        dst: /usr/share/man/man1/localpilot-kill.1
      - src: ./man/localpilot-free.1
        dst: /usr/share/man/man1/localpilot-free.1
      - src: ./man/localpilot-watch.1
        dst: /usr/share/man/man1/localpilot-watch.1
brews:
  - name: localpilot
    repository:
      owner: arpitbhalla1801
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/arpitbhalla1801/localpilot
    description: >-
      Your command center for everything running on localhost — discover,
      inspect, and safely kill processes by port or PID.
    license: MIT
    install: |
      bin.install "localpilot"
      man1.install Dir["man/*.1"]
      bash_completion.install (output = Utils.popen_read(bin/"localpilot", "completion", "bash")) => "localpilot.bash" if output
      zsh_completion.install (output = Utils.popen_read(bin/"localpilot", "completion", "zsh")) => "_localpilot" if output
      fish_completion.install (output = Utils.popen_read(bin/"localpilot", "completion", "fish")) => "localpilot.fish" if output
    test: |
      system "#{bin}/localpilot", "--version"
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
